.tx{position:absolute;left:13%;right:13%;top:11%;bottom:11%;overflow:hidden;color:rgba(70,48,24,.7);text-shadow:0 0 .7px rgba(70,48,24,.45);line-height:1.5}

<div id="bg"><div id="glow"></div><canvas id="snow"></canvas></div>
<div id="stage">
<div id="envWrap"><div id="env">
<div class="face" id="front"></div>
<div class="face" id="back"><div id="slot"></div><div class="flap" id="flapA"></div><div class="flap" id="flapB"><div class="fi"></div></div></div>
</div></div>
<div id="clip"><div id="paper"></div></div>
</div>
<div id="ctl">
<button class="btn" id="turn">Turn</button>
<button class="btn" id="undo" hidden>Undo</button>
<button class="btn" id="open" hidden>Open</button>
<button class="btn" id="prev" hidden>Undo</button>
<span id="count" hidden></span>
<button class="btn" id="next" hidden>Next</button>
<button class="btn" id="again" hidden>Start over</button>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var stage=$('stage'),envWrap=$('envWrap'),env=$('env'),paper=$('paper'),clip=$('clip'),fa=$('flapA'),fb=$('flapB'),slot=$('slot');
var B={turn:$('turn'),undo:$('undo'),open:$('open'),prev:$('prev'),next:$('next'),again:$('again')},count=$('count');
var PAGES=[{"h": "Merry Christmas, my lutang good girl.", "t": ["It’s Christmas, and here we are, still together. After sa tanan nga arguments and misunderstandings— especially ikw gd, we’re still choosing each other. Miski ga threaten kna mag break sakon halata nmn nga nd kna sakon pero bayda baton ko nlng. It’s been 1 year and 6 months, and I’m counting every day of it. Even now, I still believe we’ll last forever, hopefully."]}, {"t": ["I won’t pretend nga hapos lng na agyan ta. Especially kay tungod your conclusions got made before I had the chance to explain myself and perme nlng ko na unheard. But it’s ok, palangga tka japon. It happened because we’re two people still learning how to understand one another, ikw gd. I’d rather keep learning with you than be anywhere else.", "I’m sorry for the times I made things harder for you. I know I’ve drained you more than once, and I know I’ve let you down over and over. Please don’t blame yourself for any of it, because you carry enough already. I’m sorry for the times my words hurt you when I should have been gentle. I wish I had made it easier for you to open up to me."]}, {"t": ["If opening up to me is something you can’t do, or nd kna gd. I’ll accept that. I won’t force it, and I won’t make you feel guilty for it. I’ll be honest, it hurts a little when things are kept from me, but fine nlng, I’d rather be patient with you than pressure you. Whatever you’re carrying, I want you to know that I’m here, and I’ll keep trying to become someone you feel safe with, however long that takes."]}, {"t": ["I know this gift isn’t much. That cat pillow, and this, the QR letter, which I set up myself nga gin prompt ko lng kay nd ko sagad mag himo mga amo ni irl, waay2 ko when it comes sa creativity hehe. I chose that cat color because it reminded me of your cat, if amo gd na, and I hope that when you hold it, it feels a little like home. It’s small, but I put real thought into it, and I hope you’ll accept it."]}, {"t": ["Please send my warmest Christmas greetings to mother in law, father in law, and si Ellie. I hope your whole family has a peaceful and happy holiday.", "I know this letter is half apology and half greeting, but every word of both is sincere. Thank you for staying, for loving me, and for being patient with me even when I didn’t deserve it. I’ll keep doing my best for you, today and in all the Christmases to come.", "Merry Christmas once again, my love. I love you, always.", "Love, Jed"]}];
var n=PAGES.length,cur=0,busy=false,phase='front',stackOn=false,timers=[],sheets=[],G={},pState='hid';
PAGES.forEach(function(p){
var s=document.createElement('div');s.className='sheet';
var tx=document.createElement('div');tx.className='tx';
if(p.h){var h=document.createElement('h2');h.textContent=p.h;tx.appendChild(h);}
p.t.forEach(function(q){var e=document.createElement('p');e.textContent=q;tx.appendChild(e);});
var c=document.createElement('span');c.className='pn';c.textContent=(sheets.length+1)+' / '+n;
s.appendChild(tx);s.appendChild(c);s.tx=tx;paper.appendChild(s);sheets.push(s);});
function later(f,t){timers.push(setTimeout(f,t));}
function posT(p){var q=Math.min(p,3);return 'translate('+(q*7)+'px,'+(q*6)+'px) rotate('+((q%2?1:-1)*q*1.3)+'deg)';}
function setStack(skip){sheets.forEach(function(s,i){if(s===skip)return;var p=(i-cur+n)%n;s.style.zIndex=10+n-p;s.style.transform=posT(p);s.style.opacity=(p===0||stackOn)?1:0;});}
function paperT(k){pState=k;paper.style.transform=k==='hid'?'translate('+G.hid+'px,0) scale('+G.s0+')':k==='out'?'translate('+G.out+'px,0) scale('+G.s0+')':'none';}
function clipOn(){return 'inset(0 0 0 '+(G.vw/2+G.slotLine)+'px)';}
function fit(PW){var fs=PW*.046;
function over(){return sheets.some(function(s){return s.tx.scrollHeight>s.tx.clientHeight+1;});}
sheets.forEach(function(s){s.tx.style.fontSize=fs+'px';});
while(over()&&fs>8){fs-=.4;sheets.forEach(function(s){s.tx.style.fontSize=fs+'px';});}}
function layout(){
var vw=stage.clientWidth,envW=Math.min(vw*.78,520),envH=envW*873/2000,RT=413/740,PW=Math.min(vw*.88,400,Math.max(window.innerHeight-175,300)*RT),PH=PW/RT;
stage.style.height=Math.max(PH+50,envH+90)+'px';
envWrap.style.width=envW+'px';envWrap.style.height=envH+'px';envWrap.style.setProperty('--r',(envH*.07)+'px');
paper.style.width=PW+'px';paper.style.height=PH+'px';paper.style.marginLeft=(-PW/2)+'px';paper.style.marginTop=(-PH/2)+'px';paper.style.setProperty('--pw',PW+'px');fit(PW);
var s0=envH*.8/PH,w0=PW*s0,sl=envW*.43;
G={PW:PW,vw:vw,envH:envH,slotLine:sl,s0:s0,hid:sl-w0/2-8,out:sl-w0/2-8+w0*.62};
paperT(pState);
if(phase!=='open'){clip.style.transition='none';clip.style.clipPath=clipOn();}
setStack();}
function ctl(){
B.turn.hidden=phase!=='front';B.undo.hidden=B.open.hidden=phase!=='back';
var o=phase==='open'&&!busy;
B.prev.hidden=!(o&&cur>0);B.next.hidden=!(o&&cur<n-1);B.again.hidden=!o;count.hidden=!o;count.textContent=(cur+1)+' / '+n;}
B.turn.onclick=function(){env.style.transform='rotateY(180deg)';phase='back';ctl();};
B.undo.onclick=function(){env.style.transform='rotateY(0deg)';phase='front';ctl();};
B.open.onclick=function(){
phase='busy';ctl();
fa.style.transform='scaleX(0)';
later(function(){slot.style.opacity='1';},400);
fb.style.transitionDelay='.45s';fb.style.transform='scaleX(1)';
later(function(){paper.style.opacity='1';paperT('out');},1100);
later(function(){clip.style.transition='clip-path .9s ease';clip.style.clipPath='inset(0 0 0 0px)';env.style.transform='rotateY(180deg) translateY('+(G.envH*.7)+'px)';env.style.opacity='0';paperT('final');stackOn=true;setStack();document.body.classList.add('reading');},2200);
later(function(){clip.style.transition='none';clip.style.clipPath='none';phase='open';ctl();},3300);};
B.next.onclick=function(){
if(busy||cur>=n-1)return;busy=true;var A=sheets[cur];cur++;
A.style.transition='none';A.style.zIndex=100;A.style.transform=posT(n-1);
setStack(A);ctl();
var a=A.animate([{transform:posT(0)},{transform:'translate(-72%,12px) rotate(-9deg)',offset:.45},{transform:posT(n-1)}],{duration:900,easing:'ease-in-out'});
setTimeout(function(){A.style.zIndex=10+n-(n-1);},420);
a.onfinish=function(){A.style.transition='';busy=false;ctl();};};
B.prev.onclick=function(){
if(busy||cur<=0)return;busy=true;cur--;var P=sheets[cur];
P.style.transition='none';P.style.transform=posT(0);
setStack(P);ctl();
var a=P.animate([{transform:posT(n-1)},{transform:'translate(-72%,12px) rotate(-9deg)',offset:.55},{transform:posT(0)}],{duration:900,easing:'ease-in-out'});
setTimeout(function(){P.style.zIndex=100;},380);
a.onfinish=function(){P.style.zIndex=10+n;P.style.transition='';busy=false;ctl();};};
B.again.onclick=function(){
timers.forEach(clearTimeout);timers=[];busy=false;cur=0;stackOn=false;phase='front';document.body.classList.remove('reading');
clip.style.transition='none';clip.style.clipPath=clipOn();
paper.style.transition='none';paper.style.opacity='0';paperT('hid');void paper.offsetWidth;paper.style.transition='';
sheets.forEach(function(s){s.style.transition='none';});setStack();void paper.offsetWidth;sheets.forEach(function(s){s.style.transition='';});
slot.style.opacity='0';fb.style.transitionDelay='0s';fb.style.transform='scaleX(0)';fa.style.transform='scaleX(1)';
env.style.transform='rotateY(0deg)';env.style.opacity='1';ctl();};
window.addEventListener('resize',layout);
layout();ctl();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fit(G.PW);});
})();
</script>
<script>
(function(){
var c=document.getElementById('snow'),x=c.getContext('2d'),W=0,H=0,D=Math.min(window.devicePixelRatio||1,2),F=[],last=0,reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){W=window.innerWidth;H=window.innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);}
function mk(top){return{x:Math.random()*W,y:top?-8:Math.random()*H,r:.6+Math.random()*1.8,v:.25+Math.random()*.55,d:Math.random()*6.28,s:.3+Math.random()*.6,a:.25+Math.random()*.5};}
size();window.addEventListener('resize',size);
for(var i=0;i<95;i++)F.push(mk(false));
function tick(t){
requestAnimationFrame(tick);
if(document.hidden)return;
var dt=Math.min((t-last)/16.7||1,3);last=t;
var rd=document.body.classList.contains('reading'),N=rd?95:55,sp=rd?1.5:1;
x.clearRect(0,0,W,H);x.fillStyle='#fff';
for(var i=0;i<N;i++){var f=F[i];f.y+=f.v*sp*dt;f.d+=.01*dt;f.x+=Math.sin(f.d)*f.s*dt;
if(f.y>H+6){F[i]=f=mk(true);}
if(f.x<-6)f.x=W+6;if(f.x>W+6)f.x=-6;
x.globalAlpha=f.a;x.beginPath();x.arc(f.x,f.y,f.r,0,6.283);x.fill();}
}
if(!reduce)requestAnimationFrame(tick);
})();
</script></body></html>
